<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- The launcher icon: the tray's quest scroll in black on a white disc. 108 units is the
       adaptive-icon canvas; launchers show the middle 72, so the disc (radius 36) fills it and
       its corners stay transparent, which keeps the icon round whatever the launcher's mask. -->
  <circle cx="54" cy="54" r="36" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38.5 33.5 H67"/>
    <circle cx="67" cy="37.5" r="4"/>
    <path d="M41.5 33.5 V69"/>
    <path d="M67 41.5 V69"/>
    <rect x="36" y="69" width="36" height="8" rx="4"/>
    <path d="M54.25 43 V56.5" stroke-width="4.4"/>
  </g>
  <circle cx="54.25" cy="62.5" r="2.5" fill="#000000"/>
</svg>
